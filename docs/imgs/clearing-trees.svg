<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title description" role="img" viewBox="0 0 1120 1010"><title id="title">The Commitments Behind a Close</title><desc id="description">Each validator derives three QMDB roots: state, activity, and payout. The close commitment binds them with the close context. The state database retains balances a: 85, b: 58, c: 26, and d: 31. State uses Current Ordered QMDB, while activity and payouts use Keyless QMDB. This close appends four sorted account rows, then payment entries grouped by payer. The highlighted row for c contains debit 11, sequence 2, and c&apos;s signed outgoing-payment BMT root. Its entries reconstruct that BMT: 4 to b and 7 to d, one payment each. This close creates no payouts.</desc><rect width="1120" height="1010" fill="#fff"/><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.heading,.title{font-weight:700;fill:#111}.title{font-size:22px}.heading{font-size:18px}.label{font-size:16px;fill:#333}.note{font-size:14px;fill:#666}.center{text-anchor:middle}.blue{fill:#2424d4}.panel{fill:#fafafa;stroke:#d6d6d6;stroke-width:1.5}.record{fill:#fff;stroke:#bcbcbc}.link,.record,.selected{stroke-width:1.5}.selected{fill:#f4f4ff;stroke:#2424d4}.focus,.link{fill:none}.link{stroke:#999}.focus{stroke:#2424d4;stroke-width:2}</style><text x="32" y="40" class="title">The Commitments Behind a Close</text><text x="32" y="74" class="note">Three QMDB roots, all derived by validators</text><rect width="432" height="76" x="344" y="108" class="selected" rx="5"/><text x="560" y="140" class="heading center blue">32-byte close commitment</text><text x="560" y="167" class="note center">roots + close context</text><path d="M560 184 V214 M196 246 V214 H924 V246 M560 214 V246" class="focus"/><rect width="328" height="176" x="32" y="246" class="panel" rx="5"/><text x="196" y="282" class="heading center">State root</text><text x="196" y="315" class="note center">QMDB · Current Ordered</text><text x="90" y="361" class="label">a: 85</text><text x="230" y="361" class="label">b: 58</text><text x="90" y="395" class="label blue">c: 26</text><text x="230" y="395" class="label">d: 31</text><rect width="328" height="176" x="396" y="246" class="selected" rx="5"/><text x="560" y="282" class="heading center blue">Activity root</text><text x="560" y="315" class="note center">QMDB · Keyless</text><text x="560" y="361" class="label center">Account rows</text><text x="560" y="395" class="label center">Payment entries</text><rect width="328" height="176" x="760" y="246" class="panel" rx="5"/><text x="924" y="282" class="heading center">Payout root</text><text x="924" y="315" class="note center">QMDB · Keyless</text><text x="924" y="361" class="label center">Withdrawal outputs</text><text x="924" y="395" class="note center">None created in this close</text><text x="32" y="477" class="heading">Inside the activity log</text><text x="337" y="516" class="note center blue">4 sorted rows</text><path d="M182 569 H216 M462 569 H510" class="link"/><rect width="150" height="70" x="32" y="534" class="panel" rx="4"/><text x="107" y="563" class="note center">Earlier</text><text x="107" y="588" class="note center">closes</text><rect width="51" height="70" x="216" y="534" class="record" rx="4"/><rect width="51" height="70" x="281" y="534" class="record" rx="4"/><rect width="51" height="70" x="346" y="534" class="selected" rx="4"/><rect width="51" height="70" x="411" y="534" class="record" rx="4"/><text x="241.5" y="577" class="label center">a</text><text x="306.5" y="577" class="label center">b</text><text x="371.5" y="577" class="label center blue">c</text><text x="436.5" y="577" class="label center">d</text><rect width="578" height="70" x="510" y="534" class="record" rx="4"/><text x="799" y="563" class="label center">Payment entries, grouped by payer</text><text x="799" y="589" class="note center">a→b · b→c · c→b · c→d · d→a · d→b</text><path d="M216 616 V626 H1088 V616" class="focus"/><text x="652" y="654" class="note center blue">This close appends left to right</text><text x="32" y="707" class="heading blue">The highlighted row belongs to payer c</text><rect width="370" height="130" x="32" y="740" class="selected" rx="5"/><text x="56" y="775" class="heading blue">c&apos;s row</text><text x="56" y="813" class="label">debit 11 · sequence 2</text><text x="56" y="847" class="note">outgoing-payment root</text><path d="M402 840 H550" class="focus"/><rect width="538" height="66" x="550" y="807" class="selected" rx="4"/><text x="819" y="847" class="label center blue">BMT root signed by c</text><path d="M819 873 V895 M680 917 V895 H958 V917" class="focus"/><rect width="260" height="62" x="550" y="917" class="record" rx="4"/><rect width="260" height="62" x="828" y="917" class="record" rx="4"/><text x="680" y="943" class="label center">to b: 4</text><text x="680" y="969" class="note center">1 payment</text><text x="958" y="943" class="label center">to d: 7</text><text x="958" y="969" class="note center">1 payment</text><text x="32" y="917" class="note">Payment entries supply the leaves.</text><text x="32" y="950" class="label blue">4 + 7 = c&apos;s debit 11</text></svg>