<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title description" role="img" viewBox="0 0 1080 480"><title id="title">A fee is another entry in the signed batch</title><desc id="description">In a fresh epoch, payer a signs a batch paying 20 to b, 7 to c, and the operator&apos;s quoted fee of 2 to its designated fee recipient. Sequence 1 and cumulative debit 29 are bound to the epoch, the payment root, and an empty predecessor root, because the payer paid no one in the previous epoch. The operator countersigns this payer state. Recipient b receives that countersigned state and an opening for its entry, amount 20 and payment count 1. The same acknowledgment binds all three entries, including the fee.</desc><rect width="1080" height="480" fill="#fff"/><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.heading,.title{font-weight:700;fill:#111}.title{font-size:22px}.heading{font-size:18px}.label{font-size:16px;fill:#333}.note{font-size:14px;fill:#666}.center{text-anchor:middle}.right{text-anchor:end}.blue{fill:#2424d4}.panel{fill:#fafafa;stroke:#d6d6d6}.panel,.record{stroke-width:1.5}.flow,.record{stroke:#2424d4}.record{fill:#fff}.flow{fill:none;stroke-width:2;marker-end:url(#arrow)}.rule{stroke:#dedede;stroke-width:1}</style><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2424d4" d="M0 0 L10 5 L0 10 z"/></marker></defs><text x="36" y="46" class="title">Collecting Fees in a Batch</text><text x="36" y="78" class="note">The quoted fee is another payment covered by the same acknowledgment.</text><rect width="476" height="350" x="36" y="104" class="panel" rx="6"/><text x="58" y="140" class="heading">Payer a&apos;s signed state</text><text x="58" y="166" class="note">Fresh epoch · sequence 1 · debit 29</text><rect width="432" height="180" x="58" y="184" class="record" rx="5"/><text x="80" y="213" class="label blue">ONE PAYMENT ROOT</text><path d="M80 226 H468 M80 266 H468 M80 306 H468" class="rule"/><text x="80" y="253" class="label">to b</text><text x="468" y="253" class="label right">20</text><text x="80" y="293" class="label">to c</text><text x="468" y="293" class="label right">7</text><text x="80" y="333" class="label blue">to designated fee recipient</text><text x="468" y="333" class="label right blue">2</text><rect width="432" height="48" x="58" y="380" class="record" rx="5"/><text x="80" y="410" class="label blue">PREDECESSOR ROOT</text><text x="468" y="410" class="label right">empty</text><path d="M528 279 H568" class="flow"/><rect width="460" height="350" x="584" y="104" class="panel" rx="6"/><text x="608" y="140" class="heading">Recipient b&apos;s receipt</text><rect width="412" height="166" x="608" y="164" class="record" rx="5"/><text x="814" y="198" class="label center blue">Countersigned state R</text><text x="814" y="234" class="note center">Payer a + operator signatures</text><text x="814" y="266" class="note center">Epoch · sequence 1 · debit 29</text><text x="814" y="298" class="note center">Payment root · predecessor root</text><text x="814" y="356" class="label center">+</text><rect width="412" height="56" x="608" y="372" class="record" rx="5"/><text x="814" y="395" class="label center">b: amount 20 · payment count 1</text><text x="814" y="418" class="note center">Opening to the same payment root</text></svg>