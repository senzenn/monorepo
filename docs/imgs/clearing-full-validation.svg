<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title description" role="img" viewBox="0 0 1320 900"><title id="title">From Payments to a Certified Settlement</title><desc id="description">The operator distributes the same dealing to all 100 validators, shown as a ten-by-ten grid. A blue callout expands c&apos;s signed payer state: final sequence 2, with totals of 4 to b and 7 to d. Four cards show the canonical batch of final payer states for a, b, c, and d, which the operator signs once with its receipt key. Validators derive the Current Ordered QMDB state root and the two Keyless QMDB roots for activity and payouts, then bind them with the certified close context into one 32-byte commitment. An aggregate signature and signer bitmap form the attached 34-of-100 certificate.</desc><rect width="1320" height="900" fill="#fff"/><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.heading,.title{font-weight:700;fill:#111}.title{font-size:26px}.heading{font-size:20px}.label{font-size:18px;fill:#333}.note{font-size:16px;fill:#666}.center{text-anchor:middle}.right{text-anchor:end}.blue{fill:#2424d4}.green{fill:#087a32}.binding,.entry,.panel{stroke-width:1.5}.panel{fill:#fafafa;stroke:#d6d6d6}.entry{fill:#fff;stroke:#d0d0ef}.binding{fill:none;stroke:#087a32}.wire{fill:none;stroke-width:2}.broadcast{stroke:#2424d4;marker-end:url(#broadcast-arrow)}.vote{stroke:#087a32;marker-end:url(#vote-arrow)}.signed{fill:#087a32;stroke:#087a32}.pending{fill:#fff;stroke:#bcbcbc}.leader{fill:none;stroke-width:1.5;stroke-dasharray:1 6;stroke-linecap:round}</style><defs><marker id="broadcast-arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="none" stroke="#2424d4" stroke-width="1.2" d="M1 1 L7 4 L1 7"/></marker><marker id="vote-arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="none" stroke="#087a32" stroke-width="1.2" d="M1 1 L7 4 L1 7"/></marker><circle id="validator" r="7" stroke-width="1.5"/><g id="final-state"><path stroke-width="1.5" d="M4 0 H44 L56 12 V44 Q56 48 52 48 H4 Q0 48 0 44 V4 Q0 0 4 0 Z"/><path fill="none" stroke-width="1.5" d="M44 0 V12 H56"/></g><g id="validator-row"><use x="0" href="#validator"/><use x="26" href="#validator"/><use x="52" href="#validator"/><use x="78" href="#validator"/><use x="104" href="#validator"/><use x="130" href="#validator"/><use x="156" href="#validator"/><use x="182" href="#validator"/><use x="208" href="#validator"/><use x="234" href="#validator"/></g></defs><text x="34" y="39" class="title">From Payments to a Certified Settlement</text><text x="34" y="66" class="note">Validators derive the balances and roots from the shared dealing and their local state</text><text x="172" y="116" class="heading center">Operator</text><rect width="245" height="228" x="64" y="139" fill="#f4f4ff" stroke="#d0d0ef" stroke-width="1.5" rx="6"/><rect width="245" height="228" x="56" y="147" fill="#f4f4ff" stroke="#d0d0ef" stroke-width="1.5" rx="6"/><rect width="245" height="228" x="48" y="155" fill="#fff" stroke="#2424d4" stroke-width="1.5" rx="6"/><text x="170.5" y="189" class="heading center blue">Dealing</text><path stroke="#dedede" d="M68 205 H273"/><text x="80" y="234" class="label blue">a → b</text><text x="80" y="264" class="label blue">b → c</text><text x="80" y="294" class="label blue">c → b, d</text><text x="80" y="324" class="label blue">d → a, b</text><text x="170.5" y="363" class="note center">4 payers · 6 entries</text><path d="M310 260 H496" class="wire broadcast"/><text x="403" y="239" class="label center blue">Same bytes</text><text x="652" y="116" class="heading center">100 validators</text><rect width="300" height="256" x="503" y="147" class="panel" rx="6"/><g class="signed" transform="translate(535 181)"><use y="0" href="#validator-row"/><use y="22" href="#validator-row"/><use y="44" href="#validator-row"/></g><g transform="translate(535 247)"><use x="0" class="signed" href="#validator"/><use x="26" class="signed" href="#validator"/><use x="52" class="signed" href="#validator"/><use x="78" class="signed" href="#validator"/><use x="104" class="pending" href="#validator"/><use x="130" class="pending" href="#validator"/><use x="156" class="pending" href="#validator"/><use x="182" class="pending" href="#validator"/><use x="208" class="pending" href="#validator"/><use x="234" class="pending" href="#validator"/></g><g class="pending" transform="translate(535 269)"><use y="0" href="#validator-row"/><use y="22" href="#validator-row"/><use y="44" href="#validator-row"/><use y="66" href="#validator-row"/><use y="88" href="#validator-row"/><use y="110" href="#validator-row"/></g><text x="575" y="431" class="note center green">34 signed</text><text x="725" y="431" class="note center">66 not included</text><path d="M809 260 H990" class="wire vote"/><text x="900" y="239" class="label center green">Certify</text><path fill="#f2faf4" stroke="#087a32" stroke-width="1.5" d="M1004 177 H1264 L1286 199 V337 Q1286 343 1280 343 H1004 Q998 343 998 337 V183 Q998 177 1004 177 Z"/><path fill="none" stroke="#087a32" stroke-width="1.5" d="M1264 177 V199 H1286"/><text x="1142" y="211" class="heading center green">Certified close</text><circle cx="1046" cy="266" r="20" fill="#087a32"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M1037 266 L1044 273 L1056 259"/><text x="1172" y="277" class="center green" style="font-size:32px;font-weight:700">34 / 100</text><text x="1142" y="316" class="note center">Same commitment</text><path stroke="#2424d4" d="M403 260 V463" class="leader"/><circle cx="403" cy="260" r="4" fill="#fff" stroke="#2424d4" stroke-width="1.5"/><rect width="568" height="417" x="48" y="463" fill="#f4f4ff" stroke="#2424d4" stroke-width="1.5" rx="6"/><text x="72" y="497" class="heading blue">Dealing</text><text x="592" y="497" class="note right">Offchain</text><path stroke="#d0d0ef" d="M72 515 H592"/><text x="72" y="546" class="label">Account keys</text><rect width="76" height="30" x="252" y="526" class="entry" rx="4"/><text x="264" y="547" class="note">0</text><text x="301" y="547" class="label blue">a</text><rect width="76" height="30" x="340" y="526" class="entry" rx="4"/><text x="352" y="547" class="note">1</text><text x="389" y="547" class="label blue">b</text><rect width="76" height="30" x="428" y="526" class="entry" rx="4"/><text x="440" y="547" class="note">2</text><text x="477" y="547" class="label blue">c</text><rect width="76" height="30" x="516" y="526" class="entry" rx="4"/><text x="528" y="547" class="note">3</text><text x="565" y="547" class="label blue">d</text><text x="332" y="581" class="note center">Four sender records · c expanded</text><rect width="500" height="176" x="100" y="588" fill="#ddddf8" stroke="#b6b6eb" stroke-width="1.5" rx="5"/><rect width="500" height="176" x="92" y="596" fill="#e5e5fb" stroke="#b6b6eb" stroke-width="1.5" rx="5"/><rect width="500" height="176" x="84" y="604" fill="#eeeefe" stroke="#b6b6eb" stroke-width="1.5" rx="5"/><rect width="500" height="176" x="76" y="612" fill="#fff" stroke="#2424d4" stroke-width="1.5" rx="5"/><text x="98" y="642" class="heading blue">Sender c</text><text x="554" y="642" class="label right">Final sequence: 2</text><path stroke="#d0d0ef" d="M98 657 H554"/><rect width="218" height="70" x="98" y="674" class="entry" rx="4"/><text x="207" y="698" class="label center blue">to b</text><text x="111" y="726" class="note">total <tspan fill="#111" font-weight="700">4</tspan></text><text x="303" y="726" class="note right">count <tspan fill="#111" font-weight="700">1</tspan></text><rect width="218" height="70" x="336" y="674" class="entry" rx="4"/><text x="445" y="698" class="label center blue">to d</text><text x="349" y="726" class="note">total <tspan fill="#111" font-weight="700">7</tspan></text><text x="541" y="726" class="note right">count <tspan fill="#111" font-weight="700">1</tspan></text><path fill="none" stroke="#2424d4" stroke-linecap="round" stroke-width="2" d="M116 758 C126 737 111 777 133 754 C138 749 132 766 143 757 L151 757"/><text x="169" y="765" class="note">c&apos;s signature binds both entries</text><text x="72" y="810" class="note">Final payer states</text><text x="592" y="810" class="note right">Same receipt key</text><g transform="translate(72 822)"><use fill="#fff" stroke="#b6b6eb" href="#final-state"/><text x="25" y="32" class="label center">a</text></g><g transform="translate(138 822)"><use fill="#fff" stroke="#b6b6eb" href="#final-state"/><text x="25" y="32" class="label center">b</text></g><g transform="translate(204 822)"><use fill="#e5e5fb" stroke="#2424d4" href="#final-state"/><text x="25" y="32" class="heading center blue">c</text></g><g transform="translate(270 822)"><use fill="#fff" stroke="#b6b6eb" href="#final-state"/><text x="25" y="32" class="label center">d</text></g><text x="378" y="833" class="note center">Sign batch</text><path d="M338 847 H420" class="wire broadcast"/><rect width="160" height="48" x="432" y="822" fill="#2424d4" rx="5"/><text x="512" y="853" class="label center" style="fill:#fff">1 signature</text><path stroke="#087a32" d="M900 260 V463" class="leader"/><circle cx="900" cy="260" r="4" fill="#fff" stroke="#087a32" stroke-width="1.5"/><rect width="586" height="417" x="700" y="463" fill="#f2faf4" stroke="#087a32" stroke-width="1.5" rx="6"/><text x="724" y="497" class="heading green">Certified close</text><text x="1262" y="497" class="note right">Onchain</text><path stroke="#c7dfce" d="M724 515 H1262"/><rect width="164" height="72" x="724" y="539" fill="#fff" stroke="#087a32" stroke-width="1.5" rx="5"/><text x="806" y="568" class="label center green">State root</text><text x="806" y="594" class="note center">Current Ordered</text><rect width="164" height="72" x="911" y="539" fill="#fff" stroke="#087a32" stroke-width="1.5" rx="5"/><text x="993" y="568" class="label center green">Activity root</text><text x="993" y="594" class="note center">Keyless</text><rect width="164" height="72" x="1098" y="539" fill="#fff" stroke="#087a32" stroke-width="1.5" rx="5"/><text x="1180" y="568" class="label center green">Payout root</text><text x="1180" y="594" class="note center">Keyless</text><path d="M806 611 V629 H1180 V611 M993 611 V642" class="binding"/><rect width="538" height="40" x="724" y="642" fill="#fff" stroke="#c7dfce" stroke-width="1.5" rx="4"/><text x="993" y="668" class="note center">Certified close context</text><path marker-end="url(#vote-arrow)" d="M993 682 V704" class="binding"/><rect width="394" height="62" x="796" y="704" fill="#087a32" rx="5"/><text x="993" y="743" class="heading center" style="fill:#fff">32-byte commitment</text><path marker-end="url(#vote-arrow)" d="M993 766 V797" class="binding"/><rect width="538" height="61" x="724" y="797" fill="#fff" stroke="#087a32" stroke-width="1.5" rx="5"/><text x="805" y="835" class="heading center green">34 / 100</text><path stroke="#c7dfce" d="M886 810 V845"/><text x="907" y="822" class="label green">Certificate</text><text x="907" y="846" class="note">Aggregate signature + bitmap</text></svg>