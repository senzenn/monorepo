<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title description" role="img" viewBox="0 0 1080 432"><title id="title">At most one copy settles</title><desc id="description">Payer a reaches state n-1 with vector root P in epoch e. If e&apos;s close omits the late request r, the final vector root remains P, and retry r&apos; can settle in e+1. If the close includes r with root P&apos;, validators reject r&apos; because it signs predecessor root P. An operator receipt for r&apos; and a public proof establish a debit mismatch. At most one copy can settle.</desc><rect width="1080" height="432" fill="#fff"/><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.heading,.title{font-weight:700;fill:#111}.title{font-size:22px}.heading{font-size:18px}.label{font-size:16px;fill:#333}.note{font-size:14px;fill:#666}.center{text-anchor:middle}.right{text-anchor:end}.blue{fill:#2424d4}.green{fill:#14733b}.red{fill:#b42318}.panel{fill:#fafafa;stroke:#d6d6d6;stroke-width:1.5}.chip{fill:#fff;stroke:#2424d4}.chip,.paid,.replay{stroke-width:1.5}.paid{fill:#f1fbf5;stroke:#73b58e}.replay{fill:#fff8f7;stroke:#d98b83}.flow,.rail{fill:none;stroke:#2424d4;stroke-width:2}.step{fill:none}.flow{marker-end:url(#arrow)}.step{stroke:#999;stroke-width:1.5;marker-end:url(#gray-arrow)}.reject-flow{fill:none;stroke:#b42318;stroke-width:2;stroke-dasharray:6 4;marker-end:url(#red-arrow)}.cut{stroke:#999;stroke-width:1.5;stroke-dasharray:6 6}</style><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2424d4" d="M0 0 L10 5 L0 10 z"/></marker><marker id="gray-arrow" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#999" d="M0 0 L10 5 L0 10 z"/></marker><marker id="red-arrow" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#b42318" d="M0 0 L10 5 L0 10 z"/></marker></defs><text x="36" y="46" class="title">At Most One Copy Settles</text><text x="36" y="78" class="note">r&apos; signs predecessor root P, so r and r&apos; cannot both settle.</text><rect width="620" height="300" x="36" y="104" class="panel" rx="6"/><text x="58" y="140" class="heading">Epoch e</text><rect width="340" height="300" x="704" y="104" class="panel" rx="6"/><text x="726" y="140" class="heading">Epoch e+1</text><path d="M680 96 V416" class="cut"/><text x="58" y="270" fill="#999" class="label">···</text><path d="M92 264 H118" class="step"/><rect width="140" height="56" x="126" y="236" class="chip" rx="5"/><text x="196" y="259" class="label center">n−1</text><text x="196" y="281" class="label center blue">root P</text><path d="M266 264 H282 C310 264 310 210 338 210 H700" class="rail"/><path d="M700 210 H772" class="flow"/><text x="346" y="198" class="label">omit r</text><path d="M282 264 C310 264 310 330 338 330 H400" class="rail"/><path d="M400 330 H452" class="flow"/><text x="346" y="318" class="label">include r</text><rect width="140" height="56" x="460" y="302" class="paid" rx="5"/><text x="600" y="292" class="note right green">can settle in e</text><text x="530" y="325" class="label center">n = r</text><text x="530" y="347" class="label center blue">root P&apos;</text><path d="M608 330 H772" class="reject-flow"/><text x="743" y="318" class="label red center">P&apos; ≠ P</text><rect width="140" height="56" x="780" y="182" class="paid" rx="5"/><text x="920" y="172" class="note right green">can settle in e+1</text><text x="850" y="205" class="label center">r&apos;</text><text x="850" y="227" class="label center blue">pred P</text><rect width="140" height="56" x="780" y="302" class="replay" rx="5"/><text x="920" y="292" class="note right red">rejected</text><text x="850" y="325" class="label center">r&apos;</text><text x="850" y="347" class="label center blue">pred P</text><text x="780" y="382" class="note red">receipt + proof ⇒ fault</text></svg>