<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title description" role="img" viewBox="0 0 1080 728"><title id="title">Claiming a payout exactly once</title><desc id="description">A fixed finalized payout root proves that output 12 exists. Only finalized payout indices 10 through 14 are shown. Other claimed-map records are outside this illustration. The chain records claimed indices as end-exclusive ranges. Claiming 12 stores the range 12 through 13. Claiming 10 and 14 adds the singleton ranges 10 through 11 and 14 through 15. Claiming 11 merges the first two ranges into 10 through 13. Claiming 13 then merges all five paid outputs into one range, 10 through 15. Each claim atomically records its index, reduces the reserve, and pays the destination. Replaying 12 is rejected because a claimed range already contains it, even though its membership opening remains valid.</desc><rect width="1080" height="728" fill="#fff"/><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.title{font-size:22px;font-weight:700;fill:#111}.subtitle{font-size:14px;fill:#666}.eyebrow,.heading{font-size:16px;font-weight:700;fill:#666}.heading{font-size:18px;fill:#111}.label{font-size:16px;fill:#333}.note{font-size:14px;fill:#666}.range{font-size:18px;font-weight:700;fill:#2424d4}.center,.range{text-anchor:middle}.green{fill:#14733b}.red{fill:#b42318}.evidence,.step{fill:#f4f4ff;stroke:#b8b8ed;stroke-width:1.5}.step{fill:#fafafa;stroke:#d6d6d6}.chip{fill:#fff}.chip,.paid{stroke-width:1.5}.record{fill:#fff;stroke:#bcbcbc}.record,.replay{stroke-width:1.5}.chip{stroke:#2424d4}.paid{fill:#f1fbf5;stroke:#73b58e}.replay{fill:#fff8f7;stroke:#d98b83}.number{fill:#2424d4}.number-text{font-size:16px;font-weight:700;fill:#fff;text-anchor:middle}.flow,.reject-flow{fill:none;stroke:#2424d4;stroke-width:2;marker-end:url(#arrow)}.reject-flow{stroke:#b42318;marker-end:url(#red-arrow)}</style><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2424d4" d="M0 0 L10 5 L0 10 z"/></marker><marker id="red-arrow" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#b42318" d="M0 0 L10 5 L0 10 z"/></marker></defs><text x="36" y="46" class="title">Claiming a Payout Exactly Once</text><text x="36" y="78" class="subtitle">Membership proves existence. Claimed ranges prevent duplicate payment.</text><rect width="1008" height="84" x="36" y="102" class="evidence" rx="6"/><rect width="170" height="42" x="58" y="123" class="record" rx="4"/><text x="143" y="150" class="label center">payout root P</text><path d="M244 144 H284" class="flow"/><rect width="246" height="42" x="300" y="123" class="record" rx="4"/><text x="423" y="150" class="label center">output 12 + opening</text><path d="M562 144 H602" class="flow"/><rect width="144" height="42" x="618" y="123" class="paid" rx="4"/><text x="690" y="150" class="label center green">valid</text><text x="790" y="136" class="note">Same finalized root</text><text x="790" y="160" class="note">and opening throughout.</text><text x="36" y="226" class="eyebrow">CLAIMED RANGES · END-EXCLUSIVE</text><text x="36" y="252" class="note">Finalized payout indices 10–14 shown. Initially, none are claimed.</text><rect width="1008" height="64" x="36" y="272" class="step" rx="6"/><rect width="1008" height="64" x="36" y="352" class="step" rx="6"/><rect width="1008" height="64" x="36" y="432" class="step" rx="6"/><rect width="1008" height="64" x="36" y="512" class="step" rx="6"/><path d="M66 324 V364" class="flow"/><path d="M66 404 V444" class="flow"/><path d="M66 484 V524" class="flow"/><circle cx="66" cy="304" r="15" class="number"/><text x="66" y="310" class="number-text">1</text><text x="96" y="298" class="heading">Claim 12</text><text x="96" y="322" class="note">Record the paid index</text><rect width="124" height="40" x="762" y="284" class="chip" rx="5"/><text x="824" y="311" class="range">[12,13)</text><circle cx="66" cy="384" r="15" class="number"/><text x="66" y="390" class="number-text">2</text><text x="96" y="378" class="heading">Claim 10 and 14</text><text x="96" y="402" class="note">Three separate paid ranges</text><rect width="124" height="40" x="622" y="364" class="chip" rx="5"/><text x="684" y="391" class="range">[10,11)</text><rect width="124" height="40" x="762" y="364" class="chip" rx="5"/><text x="824" y="391" class="range">[12,13)</text><rect width="124" height="40" x="902" y="364" class="chip" rx="5"/><text x="964" y="391" class="range">[14,15)</text><circle cx="66" cy="464" r="15" class="number"/><text x="66" y="470" class="number-text">3</text><text x="96" y="458" class="heading">Claim 11</text><text x="96" y="482" class="note">Join the first two ranges</text><rect width="264" height="40" x="622" y="444" class="chip" rx="5"/><text x="754" y="471" class="range">[10,13)</text><rect width="124" height="40" x="902" y="444" class="chip" rx="5"/><text x="964" y="471" class="range">[14,15)</text><circle cx="66" cy="544" r="15" class="number"/><text x="66" y="550" class="number-text">4</text><text x="96" y="538" class="heading">Claim 13</text><text x="96" y="562" class="note">All five claims fit in one range</text><rect width="404" height="40" x="622" y="524" class="chip" rx="5"/><text x="824" y="551" class="range">[10,15)</text><rect width="1008" height="66" x="36" y="610" class="replay" rx="6"/><text x="60" y="650" class="label">Replay 12 · same valid opening</text><path d="M420 643 H472" class="reject-flow"/><text x="498" y="650" class="heading red">REJECT</text><text x="620" y="636" class="note">Already claimed:</text><text x="620" y="660" class="note">12 is inside [10,15).</text><text x="540" y="707" class="note center">Each claim atomically records its index, reduces the reserve, and pays.</text></svg>