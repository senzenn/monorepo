<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title description" role="img" viewBox="0 0 1320 590"><title id="title">Netting Across Accounts</title><desc id="description">100 million payments of $0.000001 across six directed pairs produce four net balance changes in one epoch. Account a sends $30 and receives $10, ending at $80. Account b sends $25 and receives $55, ending at $70. Account c sends $20 and receives $25, ending at $30. Account d sends $25 and receives $10, ending at $20. The close carries four account rows, six cumulative entries, and final signed payer states.</desc><rect width="1320" height="590" fill="#fff"/><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.title{font-size:26px;font-weight:700;fill:#111}.subtitle{font-size:16px;fill:#666}.panel-title{font-size:20px;font-weight:700;fill:#111;text-anchor:middle}.frame{fill:#fafafa;stroke:#d6d6d6;stroke-width:1.5}.payment{fill:none;stroke:#2424d4;stroke-width:2.5;marker-end:url(#arrow)}.amount{font-size:20px;fill:#2424d4;text-anchor:middle}.node{fill:#fff;stroke:#2424d4;stroke-width:2}.account{font-size:22px;font-weight:700;fill:#2424d4;text-anchor:middle}.heading{font-size:16px;fill:#666}.heading,.money,.small{text-anchor:end}.small{fill:#666;font-size:14px}.money{font-size:20px;fill:#111}.net{font-weight:700;fill:#2424d4}.rule{stroke:#dedede;stroke-width:1}.note{font-size:16px;fill:#555;text-anchor:middle}.close{fill:#f4f4ff;stroke:#2424d4;stroke-width:1.5}.close-title{font-size:22px;font-weight:700;fill:#2424d4;text-anchor:middle}</style><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="none" stroke="#2424d4" stroke-width="1.2" d="M1 1 L7 4 L1 7"/></marker></defs><text x="34" y="39" class="title">Netting Across Accounts</text><text x="34" y="66" class="subtitle">100 million $0.000001 payments through one operator in one epoch</text><rect width="508" height="378" x="34" y="94" class="frame" rx="6"/><text x="288" y="127" class="panel-title">6 cumulative payment entries</text><g class="payment"><path d="M166 202 H397"/><path d="M445 219 C490 253 490 335 446 366"/><path d="M399 386 H164"/><path d="M138 360 V228"/><path d="M414 361 C379 316 379 270 420 229"/><path d="M162 372 L399 219"/></g><text x="282" y="188" class="amount">$30</text><text x="510" y="300" class="amount">$25</text><text x="282" y="418" class="amount">$10</text><text x="102" y="301" class="amount">$10</text><text x="419" y="301" class="amount">$10</text><text x="278" y="280" class="amount">$15</text><circle cx="138" cy="202" r="22" class="node"/><circle cx="425" cy="202" r="22" class="node"/><circle cx="425" cy="386" r="22" class="node"/><circle cx="138" cy="386" r="22" class="node"/><text x="138" y="209" class="account">a</text><text x="425" y="209" class="account">b</text><text x="425" y="393" class="account">c</text><text x="138" y="393" class="account">d</text><text x="288" y="451" class="note">Arrows show each pair&apos;s total.</text><path fill="none" stroke="#777" stroke-width="2" d="M555 284 H588 M580 278 L588 284 L580 290"/><rect width="684" height="378" x="602" y="94" class="frame" rx="6"/><text x="944" y="127" class="panel-title">4 net balance changes</text><text x="790" y="172" class="heading">Sent</text><text x="928" y="172" class="heading">Received</text><text x="1048" y="172" class="heading">Net</text><text x="1252" y="172" class="heading">Balance</text><text x="1252" y="192" class="small">before → after</text><path d="M626 204 H1262 M626 251 H1262 M626 305 H1262 M626 359 H1262 M626 413 H1262" class="rule"/><g><text x="650" y="235" class="account">a</text><text x="790" y="235" class="money">$30</text><text x="928" y="235" class="money">$10</text><text x="1048" y="235" class="money net">−$20</text><text x="1252" y="235" class="money">$100 → $80</text></g><g><text x="650" y="289" class="account">b</text><text x="790" y="289" class="money">$25</text><text x="928" y="289" class="money">$55</text><text x="1048" y="289" class="money net">+$30</text><text x="1252" y="289" class="money">$40 → $70</text></g><g><text x="650" y="343" class="account">c</text><text x="790" y="343" class="money">$20</text><text x="928" y="343" class="money">$25</text><text x="1048" y="343" class="money net">+$5</text><text x="1252" y="343" class="money">$25 → $30</text></g><g><text x="650" y="397" class="account">d</text><text x="790" y="397" class="money">$25</text><text x="928" y="397" class="money">$10</text><text x="1048" y="397" class="money net">−$15</text><text x="1252" y="397" class="money">$35 → $20</text></g><text x="944" y="451" class="note">Net change: $0 · Total balance: $200 → $200</text><rect width="1252" height="76" x="34" y="500" class="close" rx="6"/><text x="660" y="531" class="close-title">4 active accounts · 6 payment pairs</text><text x="660" y="558" class="note">One row per account · one cumulative entry per pair · final signed payer states</text></svg>